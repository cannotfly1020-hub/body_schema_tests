<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>身体図式・脳内GPSドック</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; background: #0a0f1d; font-family: 'Noto Sans JP', sans-serif; user-select: none; -webkit-user-select: none; }
    #appContainer { max-width: 28rem; width: 100%; height: 100dvh; position: relative; display: flex; flex-direction: column; overflow: hidden; margin: 0 auto; background: #0a0f1d; }
    .screen { flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .hidden { display: none !important; }
    .btn-3d { transition: transform 0.1s, box-shadow 0.1s; box-shadow: 0 4px 0 #000; text-transform: uppercase; letter-spacing: 1px; }
    .btn-3d:active { transform: translateY(4px); box-shadow: 0 0 0 #000; }
    .neon-text-blue { text-shadow: 0 0 10px #38bdf8, 0 0 20px #38bdf8; }
    .neon-text-green { text-shadow: 0 0 10px #10b981, 0 0 20px #10b981; }
    .neon-text-yellow { text-shadow: 0 0 10px #ffea00, 0 0 20px #ffea00; }
    .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; }
    @keyframes pulse-red { 0%, 100% { box-shadow: inset 0 0 20px red; border-color: red; } 50% { box-shadow: inset 0 0 50px red; border-color: #ff4444; } }
    .danger-border { animation: pulse-red 0.5s infinite; border: 4px solid red; }
    @keyframes confetti-fall { 0% { transform: translateY(-100vh) rotate(0deg); } 100% { transform: translateY(100vh) rotate(360deg); } }
    .confetti { position: absolute; width: 10px; height: 10px; background: #10b981; animation: confetti-fall 3s linear infinite; }
  </style>
</head>
<body>
  <div id="appContainer">
    <!-- Header -->
    <header class="h-14 flex-shrink-0 bg-slate-900 flex items-center justify-between px-4 z-50 border-b border-slate-700">
      <div class="text-xl font-black text-white flex items-center gap-2">
        <span>🧠</span><span class="neon-text-blue">GPS DOCK</span>
      </div>
      <button id="btn-camera-toggle" class="btn-3d bg-slate-700 text-white px-3 py-1 rounded-lg text-sm font-bold border-2 border-slate-900 hidden">
        🔄 カメラ切替
      </button>
    </header>

    <!-- 1. Lobby Screen -->
    <div id="screen-lobby" class="screen p-4 overflow-y-auto pb-8 space-y-4">
      <div class="glass-panel p-4 flex flex-col gap-3">
        <div class="text-sky-400 font-bold text-sm">現在のアスリート</div>
        <select id="player-select" class="w-full bg-slate-800 text-white p-3 rounded-xl border-2 border-slate-700 font-bold text-lg outline-none focus:border-sky-400"></select>
        <div class="flex gap-2">
          <input type="number" id="player-height" placeholder="身長(cm)" class="flex-1 bg-slate-800 p-3 rounded-xl border-2 border-slate-700 text-white font-bold outline-none" value="170">
          <button id="btn-save-player" class="btn-3d bg-emerald-500 text-slate-900 font-black px-4 rounded-xl border-2 border-slate-900">保存</button>
        </div>
        <div id="calibration-status" class="text-sm font-bold text-rose-400">⚠️ 未キャリブレーション</div>
      </div>

      <button id="btn-go-scan" class="btn-3d bg-sky-500 text-slate-900 font-black py-4 rounded-xl border-4 border-slate-900 text-xl w-full">
        📏 直立スキャン (必須)
      </button>

      <div class="grid grid-cols-2 gap-3 mt-4">
        <button class="btn-start-test btn-3d bg-yellow-400 text-slate-900 font-black py-4 rounded-xl border-4 border-slate-900 text-lg flex flex-col items-center justify-center" data-test="footing">
          <span class="text-2xl">👣</span><span>目隠し足踏み</span>
        </button>
        <button class="btn-start-test btn-3d bg-yellow-400 text-slate-900 font-black py-4 rounded-xl border-4 border-slate-900 text-lg flex flex-col items-center justify-center" data-test="tpose">
          <span class="text-2xl">⚖️</span><span>Tポーズ</span>
        </button>
        <button class="btn-start-test btn-3d bg-yellow-400 text-slate-900 font-black py-4 rounded-xl border-4 border-slate-900 text-lg flex flex-col items-center justify-center" data-test="oneleg">
          <span class="text-2xl">⚓</span><span>片足立ち</span>
        </button>
        <button class="btn-start-test btn-3d bg-yellow-400 text-slate-900 font-black py-4 rounded-xl border-4 border-slate-900 text-lg flex flex-col items-center justify-center" data-test="pelvis">
          <span class="text-2xl">🪑</span><span>骨盤制動</span>
        </button>
      </div>

      <div class="flex gap-3 mt-2">
        <button id="btn-go-drill" class="btn-3d bg-emerald-500 flex-1 text-slate-900 font-black py-4 rounded-xl border-4 border-slate-900 text-lg">
          🔥 ドリルへ
        </button>
        <button id="btn-go-record" class="btn-3d bg-purple-500 flex-1 text-white font-black py-4 rounded-xl border-4 border-slate-900 text-lg">
          📈 カルテ
        </button>
      </div>
    </div>

    <!-- 2. Scan Screen -->
    <div id="screen-scan" class="screen hidden">
      <div class="absolute top-4 left-0 w-full z-10 text-center">
        <div class="bg-slate-900/80 inline-block px-6 py-2 rounded-full font-bold text-sky-400 border border-sky-400/50">
          約2m離れて全身を映し、直立してください
        </div>
      </div>
      <div id="scan-progress-container" class="absolute bottom-10 left-1/2 -translate-x-1/2 w-3/4 h-6 bg-slate-800 rounded-full border-2 border-slate-600 z-10 overflow-hidden hidden">
        <div id="scan-progress-bar" class="h-full bg-emerald-500 w-0 transition-all duration-100"></div>
      </div>
      <button class="btn-back-lobby btn-3d absolute top-4 left-4 z-20 bg-slate-700 text-white p-2 rounded-lg border-2 border-slate-900 font-bold">戻る</button>
    </div>

    <!-- 3. Test Screen -->
    <div id="screen-test" class="screen hidden">
      <div class="absolute top-4 left-0 w-full z-10 flex flex-col items-center">
        <div id="test-title" class="bg-yellow-400 text-slate-900 px-6 py-1 rounded-full font-black text-xl border-2 border-slate-900 shadow-lg"></div>
        <div id="test-timer" class="text-4xl font-black text-white drop-shadow-[0_2px_2px_rgba(0,0,0,1)] mt-2">15.0s</div>
      </div>
      <div id="test-countdown" class="absolute inset-0 z-20 flex items-center justify-center text-9xl font-black neon-text-yellow drop-shadow-[0_5px_5px_rgba(0,0,0,1)] hidden"></div>
      <div id="test-warning" class="absolute inset-0 z-30 flex items-center justify-center bg-red-900/80 text-white text-3xl font-black p-4 text-center hidden"></div>
      <button id="btn-cancel-test" class="btn-back-lobby btn-3d absolute top-4 left-4 z-20 bg-slate-700 text-white p-2 rounded-lg border-2 border-slate-900 font-bold">中止</button>
    </div>

    <!-- 4. Result Screen -->
    <div id="screen-result" class="screen hidden bg-slate-900 p-4 flex flex-col gap-4">
      <h2 class="text-2xl font-black text-center text-yellow-400 mt-2">リプレイ & 解析結果</h2>
      <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border-2 border-slate-700">
        <video id="replay-video" class="w-full h-full object-cover" controls playsinline loop></video>
      </div>
      <div class="glass-panel p-6 flex flex-col items-center justify-center flex-1">
        <div id="result-score" class="text-4xl font-black neon-text-blue mb-2">【★ 覚醒度 --%】</div>
        <div id="result-detail" class="text-lg font-bold text-slate-300 text-center whitespace-pre-line"></div>
      </div>
      <div class="flex gap-3 mb-4">
        <button id="btn-save-record" class="btn-3d bg-emerald-500 flex-1 text-slate-900 font-black py-4 rounded-xl border-4 border-slate-900 text-xl">カルテに記録</button>
        <button class="btn-back-lobby btn-3d bg-slate-600 flex-1 text-white font-black py-4 rounded-xl border-4 border-slate-900 text-xl">破棄して戻る</button>
      </div>
    </div>

    <!-- 5. Drill Screen -->
    <div id="screen-drill" class="screen hidden">
      <div class="absolute top-4 left-0 w-full z-10 flex flex-col items-center">
        <div class="bg-emerald-500 text-slate-900 px-6 py-1 rounded-full font-black text-xl border-2 border-slate-900 shadow-lg">胸回しドリル</div>
        <div class="bg-slate-900/80 text-white px-4 py-1 rounded-full mt-2 font-bold text-sm">手を頭の後ろで組み、骨盤を固定して胸を回す</div>
      </div>
      <div id="drill-counter" class="absolute top-20 right-4 z-10 text-5xl font-black neon-text-green drop-shadow-md">0回</div>
      <div id="drill-instruction" class="absolute bottom-10 left-0 w-full z-10 text-center text-2xl font-black text-white drop-shadow-md transition-opacity"></div>
      <button class="btn-back-lobby btn-3d absolute top-4 left-4 z-20 bg-slate-700 text-white p-2 rounded-lg border-2 border-slate-900 font-bold">戻る</button>
    </div>

    <!-- 6. Record Screen -->
    <div id="screen-record" class="screen hidden p-4 bg-slate-900 overflow-y-auto pb-10">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-black text-purple-400">成長カルテ</h2>
        <button class="btn-back-lobby btn-3d bg-slate-700 text-white px-4 py-2 rounded-lg border-2 border-slate-900 font-bold">戻る</button>
      </div>
      <div class="glass-panel p-4 mb-4">
        <h3 class="text-sm font-bold text-slate-400 mb-2">覚醒度推移 (直近10回)</h3>
        <div id="graph-container" class="w-full h-40 relative"></div>
      </div>
      <div id="record-list" class="flex flex-col gap-2"></div>
    </div>

    <!-- Camera Container (Shared for Scan, Test, Drill) -->
    <div id="camera-container" class="absolute inset-0 w-full h-full -z-10 bg-black hidden">
      <video id="camera-video" class="absolute inset-0 w-full h-full object-cover" playsinline muted></video>
      <canvas id="camera-canvas" class="absolute inset-0 w-full h-full object-cover"></canvas>
    </div>

    <!-- Sleep Overlay -->
    <div id="sleep-overlay" class="absolute inset-0 z-[100] bg-black/95 flex flex-col items-center justify-center hidden">
      <div class="text-4xl mb-4">💤</div>
      <div class="text-xl font-bold text-slate-400 mb-8">スリープモード</div>
      <button id="btn-wakeup" class="btn-3d bg-sky-500 text-slate-900 font-black py-3 px-8 rounded-xl border-4 border-slate-900 text-xl">タップして復帰</button>
    </div>
  </div>

  <script>
    // === Core Setup & Global State ===
    const STORAGE_KEY = 'brainGPS_v1';
    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { players: [], records: [] };
    if (appData.players.length === 0) {
      appData.players.push({ id: 'p1', name: '選手1', height: 170, calibration: null });
      saveData();
    }
    let currentPlayer = appData.players[0];
    let sessionBlobs = {}; // { recordId: blobUrl }

    let currentScreen = 'lobby';
    let facingMode = 'user';
    let isCameraRunning = false;
    let cameraStream = null;
    let animFrameId = null;
    
    // Test/Drill State
    let appMode = 'none'; // 'scan', 'test_footing', 'test_tpose', 'test_oneleg', 'test_pelvis', 'drill_chest'
    let testState = { phase: 'idle', timer: 0, graceTime: 0, startTime: 0, framesData: [], startConfig: null };
    let testInterval = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let currentReplayBlob = null;
    let drillState = { count: 0, holdFrames: 0, active: false };

    const videoEl = document.getElementById('camera-video');
    const canvasEl = document.getElementById('camera-canvas');
    const ctx = canvasEl.getContext('2d');
    const cameraContainer = document.getElementById('camera-container');

    // === Audio & Speech ===
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    
    function initAudio() {
      if(!audioCtx) audioCtx = new AudioContext();
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq = 440, type = 'sine', dur = 0.1) {
      if(!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + dur);
      osc.stop(audioCtx.currentTime + dur);
    }

    function speak(text) {
      if(window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = 'ja-JP'; ut.rate = 1.2;
      window.speechSynthesis.speak(ut);
    }

    // === Sleep Management ===
    let sleepTimer;
    let isSleeping = false;
    function resetSleepTimer() {
      clearTimeout(sleepTimer);
      if(isSleeping) return; // Wait for explicit wakeup
      sleepTimer = setTimeout(() => {
        isSleeping = true;
        document.getElementById('sleep-overlay').classList.remove('hidden');
        if(isCameraRunning) stopCamera(); // Pause camera
      }, 90000);
    }
    ['click', 'touchstart', 'mousemove'].forEach(e => window.addEventListener(e, () => { initAudio(); resetSleepTimer(); }));
    document.getElementById('btn-wakeup').addEventListener('click', () => {
      isSleeping = false;
      document.getElementById('sleep-overlay').classList.add('hidden');
      resetSleepTimer();
      if(['scan', 'test', 'drill'].includes(currentScreen)) startCamera();
    });

    // === MediaPipe Initialization ===
    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, enableSegmentation: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onPoseResults);

    // === Camera & Lifecycle ===
    async function startCamera() {
      stopCamera();
      initAudio();
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode, width: 640, height: 480 }, audio: false });
        videoEl.srcObject = cameraStream;
        await videoEl.play();
        isCameraRunning = true;
        updateMirrorStyle();
        processVideoFrame();
      } catch (e) { alert("カメラ起動エラー: " + e.message); }
    }

    function stopCamera() {
      isCameraRunning = false;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
      videoEl.srcObject = null;
    }

    function updateMirrorStyle() {
      if(facingMode === 'user') {
        videoEl.classList.add('-scale-x-100'); canvasEl.classList.add('-scale-x-100');
      } else {
        videoEl.classList.remove('-scale-x-100'); canvasEl.classList.remove('-scale-x-100');
      }
    }

    document.getElementById('btn-camera-toggle').addEventListener('click', () => {
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      startCamera();
    });

    async function processVideoFrame() {
      if (!isCameraRunning) return;
      if (videoEl.readyState >= 2) {
        canvasEl.width = videoEl.videoWidth; canvasEl.height = videoEl.videoHeight;
        await pose.send({image: videoEl});
      }
      if(isCameraRunning) animFrameId = requestAnimationFrame(processVideoFrame);
    }

    function switchScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      document.getElementById('screen-' + id).classList.remove('hidden');
      currentScreen = id;
      
      const camBtn = document.getElementById('btn-camera-toggle');
      if (['scan', 'test', 'drill'].includes(id)) {
        cameraContainer.classList.remove('hidden');
        cameraContainer.classList.add('z-0');
        camBtn.classList.remove('hidden');
        startCamera();
      } else {
        cameraContainer.classList.add('hidden');
        cameraContainer.classList.remove('z-0');
        camBtn.classList.add('hidden');
        stopCamera();
        cleanupTestSession();
      }
      resetSleepTimer();
    }

    // === Navigation Bindings ===
    document.querySelectorAll('.btn-back-lobby').forEach(btn => btn.addEventListener('click', () => switchScreen('lobby')));
    document.getElementById('btn-go-scan').addEventListener('click', () => { appMode = 'scan'; testState.framesData = []; switchScreen('scan'); });
    document.getElementById('btn-go-drill').addEventListener('click', () => { appMode = 'drill_chest'; drillState = {count:0, holdFrames:0, active:false}; document.getElementById('drill-counter').textContent='0回'; switchScreen('drill'); });
    document.getElementById('btn-go-record').addEventListener('click', () => { renderRecords(); switchScreen('record'); });

    document.querySelectorAll('.btn-start-test').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if(!currentPlayer.calibration) { alert("先に直立スキャンを行ってください"); return; }
        appMode = 'test_' + btn.dataset.test;
        document.getElementById('test-title').textContent = btn.querySelector('span:last-child').textContent;
        startTestSequence();
        switchScreen('test');
      });
    });

    // === App Logic: Save/Load ===
    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }
    function renderPlayerSelect() {
      const sel = document.getElementById('player-select');
      sel.innerHTML = appData.players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      sel.value = currentPlayer.id;
      document.getElementById('player-height').value = currentPlayer.height;
      updateCalibrationUI();
    }
    function updateCalibrationUI() {
      const el = document.getElementById('calibration-status');
      if(currentPlayer.calibration) { el.textContent = '✅ キャリブレーション済'; el.classList.replace('text-rose-400', 'text-emerald-400'); }
      else { el.textContent = '⚠️ 未キャリブレーション'; el.classList.replace('text-emerald-400', 'text-rose-400'); }
    }
    document.getElementById('player-select').addEventListener('change', e => {
      currentPlayer = appData.players.find(p => p.id === e.target.value);
      document.getElementById('player-height').value = currentPlayer.height;
      updateCalibrationUI();
    });
    document.getElementById('btn-save-player').addEventListener('click', () => {
      currentPlayer.height = parseInt(document.getElementById('player-height').value) || 170;
      saveData();
      alert("保存しました");
    });

    // === MediaPipe Processing ===
    function onPoseResults(results) {
      // 1. Draw to Canvas (Object cover mapping)
      ctx.save();
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      if (facingMode === 'user') { ctx.translate(canvasEl.width, 0); ctx.scale(-1, 1); }
      // HTML requirement: video and canvas overlapping. Drawing video onto canvas for recording purposes.
      ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);
      
      let poseColor = '#38bdf8';
      let isDrillSuccess = false;

      // Drill Check
      if (appMode === 'drill_chest' && results.poseLandmarks) {
        isDrillSuccess = processDrill(results.poseLandmarks);
        if(isDrillSuccess) poseColor = '#10b981';
      }

      if (results.poseLandmarks) {
        drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {color: poseColor, lineWidth: 4});
        drawLandmarks(ctx, results.poseLandmarks, {color: '#ffffff', lineWidth: 2, radius: 4});
      }
      ctx.restore();

      // 2. Logic processing based on mode
      if (!results.poseLandmarks) return;
      const lm = results.poseLandmarks;

      if (appMode === 'scan') processScan(lm);
      else if (appMode.startsWith('test_')) processTestFrame(lm);
    }

    // --- Scan Logic ---
    let scanWaitFrames = 0;
    function processScan(lm) {
      // Check full body visibility (Nose to Heels)
      const isVisible = (i) => lm[i].visibility > 0.7 && lm[i].y > 0.05 && lm[i].y < 0.95;
      const valid = isVisible(0) && isVisible(11) && isVisible(12) && isVisible(23) && isVisible(24) && isVisible(27) && isVisible(28);
      
      const bar = document.getElementById('scan-progress-bar');
      const container = document.getElementById('scan-progress-container');
      
      if(valid) {
        container.classList.remove('hidden');
        scanWaitFrames++;
        bar.style.width = Math.min(100, (scanWaitFrames / 30) * 100) + '%';
        if (scanWaitFrames >= 30) {
          appMode = 'none';
          playBeep(880, 'square', 0.3);
          const topY = lm[0].y; const bottomY = Math.max(lm[27].y, lm[28].y);
          const pxHeight = (bottomY - topY) * canvasEl.height;
          currentPlayer.calibration = {
            pxPerCm: pxHeight / currentPlayer.height,
            baseHipWidth: Math.abs(lm[23].x - lm[24].x) * canvasEl.width,
            baseShoulderWidth: Math.abs(lm[11].x - lm[12].x) * canvasEl.width
          };
          saveData();
          updateCalibrationUI();
          speak("スキャン完了です");
          setTimeout(() => switchScreen('lobby'), 1000);
        }
      } else {
        scanWaitFrames = 0; bar.style.width = '0%'; container.classList.add('hidden');
      }
    }

    // --- Test Logic ---
    let stableFrames = 0;
    function startTestSequence() {
      cleanupTestSession();
      testState = { phase: 'waiting', timer: 0, graceTime: 0, framesData: [], startConfig: null };
      stableFrames = 0;
      document.getElementById('test-timer').textContent = "スタンバイ...";
      document.getElementById('test-countdown').classList.add('hidden');
      document.getElementById('test-warning').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('danger-border');
    }

    function processTestFrame(lm) {
      if (testState.phase === 'waiting') {
        const isVisible = (i) => lm[i].visibility > 0.7 && lm[i].y > 0.05 && lm[i].y < 0.95 && lm[i].x > 0.05 && lm[i].x < 0.95;
        if (isVisible(0) && isVisible(23) && isVisible(24) && isVisible(27) && isVisible(28)) {
          stableFrames++;
          if(stableFrames >= 12) {
            testState.phase = 'countdown';
            doCountdown();
          }
        } else { stableFrames = 0; }
        return;
      }

      if (testState.phase === 'running') {
        const tNow = Date.now();
        const elapsed = (tNow - testState.startTime) / 1000;
        const grace = elapsed < 1.5;
        
        // Safety / Bounds check
        const hipWidth = Math.abs(lm[23].x - lm[24].x) * canvasEl.width;
        let isOut = lm[0].y < 0 || lm[23].y > 1 || lm[24].y > 1 || lm[23].x < 0 || lm[23].x > 1;
        let isRush = hipWidth > currentPlayer.calibration.baseHipWidth * 1.7;

        if (!grace && (isOut || isRush)) {
          abortTest(isRush ? "🚨 85cm以上 前方へ突進検知！" : "🚨 画面枠外へ逸脱検知！");
          return;
        }

        // Data collection per type
        let data = { time: elapsed };
        const px2cm = currentPlayer.calibration.pxPerCm;

        if (appMode === 'test_footing') {
          if(!testState.startConfig) testState.startConfig = { cx: (lm[23].x+lm[24].x)/2, hw: currentPlayer.calibration.baseHipWidth };
          let cx = (lm[23].x+lm[24].x)/2;
          data.xShift = (cx - testState.startConfig.cx) * canvasEl.width / px2cm;
          data.zShift = 200 * (1 - testState.startConfig.hw / hipWidth); // approx cm
          data.pelvisRot = Math.atan2(lm[24].z - lm[23].z, lm[24].x - lm[23].x) * 180 / Math.PI;
        } 
        else if (appMode === 'test_tpose') {
          data.armL = Math.atan2(lm[15].y - lm[11].y, lm[15].x - lm[11].x) * 180 / Math.PI;
          data.armR = Math.atan2(lm[16].y - lm[12].y, lm[16].x - lm[12].x) * 180 / Math.PI;
          data.wristDiff = Math.abs(lm[15].y - lm[16].y) * canvasEl.height / px2cm;
        }
        else if (appMode === 'test_oneleg') {
          if(!testState.startConfig) {
            testState.startConfig = { floatIdx: lm[27].y < lm[28].y ? 27 : 28, standIdx: lm[27].y < lm[28].y ? 28 : 27, noseXs: [] };
          }
          testState.startConfig.noseXs.push(lm[0].x);
          const noseXs = testState.startConfig.noseXs;
          data.headSway = (Math.max(...noseXs) - Math.min(...noseXs)) * canvasEl.width / px2cm;
          
          // Drop check
          if (!grace && Math.abs(lm[testState.startConfig.floatIdx].y - lm[testState.startConfig.standIdx].y) < 0.03) {
            finishTest(); return;
          }
        }
        else if (appMode === 'test_pelvis') {
          data.shoulderRot = Math.atan2(lm[12].z - lm[11].z, lm[12].x - lm[11].x) * 180 / Math.PI;
          data.pelvisRot = Math.atan2(lm[24].z - lm[23].z, lm[24].x - lm[23].x) * 180 / Math.PI;
          data.xFactor = Math.abs(data.shoulderRot - data.pelvisRot);
        }
        testState.framesData.push(data);
      }
    }

    function doCountdown() {
      let count = 3;
      const cdEl = document.getElementById('test-countdown');
      cdEl.classList.remove('hidden');
      cdEl.textContent = count;
      speak(count.toString());
      
      let iv = setInterval(() => {
        count--;
        if(count > 0) {
          cdEl.textContent = count; speak(count.toString()); playBeep(660);
        } else if (count === 0) {
          cdEl.textContent = "GO!"; speak("スタート"); playBeep(880, 'square', 0.3);
          startRecording();
          beginActualTest();
        } else {
          clearInterval(iv);
          cdEl.classList.add('hidden');
        }
      }, 1000);
      testInterval = iv;
    }

    function beginActualTest() {
      testState.phase = 'running';
      testState.startTime = Date.now();
      let limit = 15;
      if(appMode === 'test_tpose') limit = 6;
      if(appMode === 'test_pelvis') limit = 10;
      
      const timerEl = document.getElementById('test-timer');
      
      testInterval = setInterval(() => {
        let elap = (Date.now() - testState.startTime) / 1000;
        let rem = Math.max(0, limit - elap);
        timerEl.textContent = rem.toFixed(1) + 's';
        if (rem <= 0) {
          finishTest();
        }
      }, 100);

      if(appMode === 'test_footing') {
        // Metronome 100BPM -> 600ms
        let metro = setInterval(() => {
           if(testState.phase !== 'running') clearInterval(metro);
           else playBeep(440, 'sine', 0.05);
        }, 600);
      }
    }

    function abortTest(msg) {
      cleanupTestSession();
      const warnEl = document.getElementById('test-warning');
      warnEl.textContent = msg; warnEl.classList.remove('hidden');
      document.getElementById('appContainer').classList.add('danger-border');
      playBeep(220, 'sawtooth', 1.0);
      setTimeout(() => {
        document.getElementById('appContainer').classList.remove('danger-border');
        switchScreen('lobby');
      }, 3000);
    }

    function finishTest() {
      cleanupTestSession();
      playBeep(880, 'square', 0.2); setTimeout(()=>playBeep(880, 'square', 0.4), 250);
      calculateScoreAndShowResult();
    }

    function cleanupTestSession() {
      if(testInterval) clearInterval(testInterval);
      if(window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      stopRecording();
      testState.phase = 'idle';
    }

    // --- Recording ---
    function startRecording() {
      recordedChunks = [];
      try {
        const stream = canvasEl.captureStream(30);
        let mime = 'video/webm';
        if(!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
        mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
        mediaRecorder.start();
      } catch(e) { console.warn("Recording failed", e); }
    }
    
    function stopRecording() {
      if(mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
          currentReplayBlob = blob;
          const url = URL.createObjectURL(blob);
          document.getElementById('replay-video').src = url;
          document.getElementById('replay-video').play();
        };
        mediaRecorder.stop();
      }
    }

    // --- Score Calculation ---
    let pendingRecord = null;
    function calculateScoreAndShowResult() {
      let score = 0; let detail = "";
      const frames = testState.framesData;
      if(frames.length === 0) { abortTest("データ不足エラー"); return; }
      
      const last10 = frames.slice(-10);
      const avg = (key) => last10.reduce((s, f) => s + Math.abs(f[key]), 0) / last10.length;

      if(appMode === 'test_footing') {
        let x = avg('xShift'); let z = avg('zShift'); let rot = avg('pelvisRot');
        score = Math.max(0, 100 - (x + Math.abs(z)*0.5 + rot));
        detail = `X変位: ${x.toFixed(1)}cm\nZ変位: ${z.toFixed(1)}cm\n骨盤回旋: ${rot.toFixed(1)}°\n🔒 あと ${(100-score).toFixed(1)}pt で完全覚醒`;
      }
      else if(appMode === 'test_tpose') {
        let al = avg('armL'); let ar = avg('armR'); let wd = avg('wristDiff');
        let diff = Math.abs(Math.abs(al) - Math.abs(ar));
        score = Math.max(0, 100 - (diff * 2 + wd * 2));
        detail = `腕角度差: ${diff.toFixed(1)}°\n手首高低差: ${wd.toFixed(1)}cm\n🔒 左右差をなくせば覚醒！`;
      }
      else if(appMode === 'test_oneleg') {
        let dur = frames[frames.length-1].time;
        let sway = avg('headSway');
        score = Math.max(0, Math.min(100, (dur / 15) * 100 - sway));
        detail = `耐久時間: ${dur.toFixed(1)}秒\n頭部動揺: ${sway.toFixed(1)}cm\n🔒 体幹を固めろ！`;
      }
      else if(appMode === 'test_pelvis') {
        let maxXF = Math.max(...frames.map(f => f.xFactor));
        score = Math.max(0, Math.min(100, maxXF * 2)); // Example scale
        detail = `最大X-Factor: ${maxXF.toFixed(1)}°\n🔒 肩と腰を分離させろ！`;
      }

      score = Math.round(score);
      document.getElementById('result-score').textContent = `【★ 覚醒度 ${score}%】`;
      document.getElementById('result-detail').textContent = detail;
      speak(`覚醒度、${score}パーセント`);

      pendingRecord = {
        id: 'rec_' + Date.now(),
        playerId: currentPlayer.id,
        test: appMode.replace('test_', ''),
        score: score,
        date: new Date().toISOString(),
        detail: detail.replace(/\n/g, ' / ')
      };

      switchScreen('result');
    }

    document.getElementById('btn-save-record').addEventListener('click', () => {
      if(pendingRecord) {
        appData.records.push(pendingRecord);
        saveData();
        if(currentReplayBlob) {
          sessionBlobs[pendingRecord.id] = URL.createObjectURL(currentReplayBlob);
        }
        alert("カルテに保存しました");
      }
      switchScreen('lobby');
    });

    // --- Drill Logic ---
    function processDrill(lm) {
      const isVisible = (i) => lm[i].visibility > 0.6;
      if(!isVisible(0) || !isVisible(11) || !isVisible(12) || !isVisible(13) || !isVisible(14) || !isVisible(15) || !isVisible(16)) return false;
      
      // Hands behind head (wrists near nose y, above shoulders)
      let handsHigh = lm[15].y < lm[11].y && lm[16].y < lm[12].y;
      // Elbows open wide
      let elbowsWide = Math.abs(lm[13].x - lm[14].x) > Math.abs(lm[11].x - lm[12].x) * 1.5;
      
      // Shoulder rotation
      let shoulderRot = Math.abs(Math.atan2(lm[12].z - lm[11].z, lm[12].x - lm[11].x) * 180 / Math.PI);
      
      let inst = document.getElementById('drill-instruction');
      if (handsHigh && elbowsWide) {
        if(shoulderRot > 30) {
          inst.textContent = "そのままキープ！"; inst.className = "absolute bottom-10 left-0 w-full z-10 text-center text-3xl font-black neon-text-green";
          drillState.holdFrames++;
          if(drillState.holdFrames > 90 && !drillState.active) { // 3s at 30fps
            drillState.count++; drillState.active = true;
            document.getElementById('drill-counter').textContent = drillState.count + "回";
            playBeep(1046, 'square', 0.2); // C6
            createConfetti();
          }
          return true; // emit green
        } else {
          inst.textContent = "もっと胸を回せ！"; inst.className = "absolute bottom-10 left-0 w-full z-10 text-center text-2xl font-black neon-text-yellow";
          drillState.holdFrames = 0; drillState.active = false;
        }
      } else {
        inst.textContent = "手を頭の後ろで組み、肘を開く"; inst.className = "absolute bottom-10 left-0 w-full z-10 text-center text-xl font-bold text-white";
        drillState.holdFrames = 0; drillState.active = false;
      }
      return false;
    }

    function createConfetti() {
      for(let i=0; i<20; i++) {
        let c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.backgroundColor = ['#10b981', '#38bdf8', '#ffea00'][Math.floor(Math.random()*3)];
        c.style.animationDuration = (2 + Math.random()) + 's';
        document.getElementById('screen-drill').appendChild(c);
        setTimeout(()=>c.remove(), 3000);
      }
    }

    // --- Record / Graph Logic ---
    const testNames = { footing: '足踏み', tpose: 'Tポーズ', oneleg: '片足立', pelvis: '骨盤制動' };
    function renderRecords() {
      const myRecs = appData.records.filter(r => r.playerId === currentPlayer.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
      const listEl = document.getElementById('record-list');
      listEl.innerHTML = '';
      
      // Graph
      const gContainer = document.getElementById('graph-container');
      const recent = myRecs.slice(-10);
      if(recent.length > 0) {
        const w = 300, h = 150;
        let pts = recent.map((r, i) => `${(i/Math.max(1, recent.length-1))*w},${h - (r.score/100)*h}`).join(' ');
        let circles = recent.map((r, i) => `<circle cx="${(i/Math.max(1, recent.length-1))*w}" cy="${h - (r.score/100)*h}" r="5" fill="#38bdf8" />`).join('');
        gContainer.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="w-full h-full overflow-visible">
          <polyline points="${pts}" fill="none" stroke="#ffea00" stroke-width="3" stroke-linecap="round"/>
          ${circles}</svg>`;
      } else { gContainer.innerHTML = '<div class="text-slate-500 text-center mt-10">データなし</div>'; }

      // List
      [...myRecs].reverse().forEach(r => {
        let div = document.createElement('div');
        div.className = 'bg-slate-800 p-3 rounded-lg border border-slate-700 flex flex-col gap-1';
        let dStr = new Date(r.date).toLocaleString('ja-JP', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
        let html = `<div class="flex justify-between items-center"><span class="font-bold text-sky-400">${testNames[r.test] || r.test}</span><span class="text-xs text-slate-400">${dStr}</span></div>
                    <div class="text-2xl font-black text-yellow-400">★ ${r.score}</div>
                    <div class="text-xs text-slate-300">${r.detail}</div>`;
        
        if (sessionBlobs[r.id]) {
          html += `<button class="btn-play-rec btn-3d mt-2 bg-purple-500 text-white py-1 rounded text-sm font-bold" data-id="${r.id}">▶ 当時の映像を再生</button>`;
        }
        div.innerHTML = html;
        listEl.appendChild(div);
      });

      document.querySelectorAll('.btn-play-rec').forEach(btn => {
        btn.addEventListener('click', (e) => {
          let id = e.target.dataset.id;
          if(sessionBlobs[id]) {
            document.getElementById('replay-video').src = sessionBlobs[id];
            document.getElementById('result-score').textContent = "リプレイ再生中";
            document.getElementById('result-detail').textContent = "";
            switchScreen('result');
            document.getElementById('btn-save-record').classList.add('hidden'); // disable save in playback
          }
        });
      });
    }

    // Initialize UI
    renderPlayerSelect();
  </script>
</body>
