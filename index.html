<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>身体図式・脳内GPSドック</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe Pose CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap');
    
    :root {
      --bg-dark: #0a0f1d;
      --primary: #fcd34d;
      --secondary: #38bdf8;
      --danger: #f87171;
      --success: #34d399;
    }
    
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--bg-dark);
      color: white;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 3D Button Style */
    .btn-3d {
      transition: all 0.1s ease;
      box-shadow: 0 6px 0 rgba(0,0,0,0.5);
    }
    .btn-3d:active {
      transform: translateY(6px);
      box-shadow: 0 0px 0 rgba(0,0,0,0.5);
    }
    .btn-primary { background: linear-gradient(145deg, #fde047, #f59e0b); color: #451a03; border: 2px solid #fff; }
    .btn-secondary { background: linear-gradient(145deg, #7dd3fc, #0284c7); color: #fff; border: 2px solid #e0f2fe; }
    .btn-danger { background: linear-gradient(145deg, #fca5a5, #dc2626); color: #fff; border: 2px solid #fee2e2; }

    /* Sunburst / RPG Effects */
    .sunburst {
      background: repeating-conic-gradient(from 0deg, transparent 0deg 15deg, rgba(255, 255, 255, 0.05) 15deg 30deg);
      animation: rotate-sunburst 20s linear infinite;
    }
    @keyframes rotate-sunburst { 100% { transform: rotate(360deg); } }
    
    .hud-overlay { text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    
    /* Screen transition */
    .screen { display: none; height: 100dvh; width: 100vw; position: absolute; top: 0; left: 0; flex-direction: column; }
    .screen.active { display: flex; animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    
    /* Mirror Canvas */
    .mirror { transform: scaleX(-1); }
    
    /* Loading Spinner */
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="app">
    <!-- Header (Global) -->
    <header class="absolute top-0 w-full p-4 flex justify-between items-center z-50 pointer-events-none">
      <h1 class="text-xl font-black italic hud-overlay tracking-wider text-white">GPS DOCK</h1>
      <button id="btn-camera-toggle" class="pointer-events-auto bg-gray-800/80 p-2 rounded-full border-2 border-gray-500 backdrop-blur" onclick="App.toggleCameraFacing()">
        📷 🔄
      </button>
    </header>

    <!-- 1. Lobby Screen -->
    <div id="screen-lobby" class="screen active p-6 justify-center items-center sunburst">
      <div class="z-10 w-full max-w-sm flex flex-col gap-6">
        <h2 class="text-3xl font-black text-center mb-4 text-[#fcd34d] drop-shadow-lg">身体図式・脳内GPS</h2>
        
        <div class="bg-gray-800/90 p-4 rounded-xl border-2 border-gray-600 backdrop-blur shadow-2xl">
          <label class="block text-sm text-gray-400 mb-1">👤 選手管理</label>
          <select id="player-select" class="w-full bg-gray-900 border-2 border-gray-600 rounded-lg p-3 text-lg font-bold outline-none mb-3" onchange="App.selectPlayer(this.value)">
            <!-- Options dynamically added -->
          </select>
          <button onclick="UIManager.showModal('modal-new-player')" class="w-full py-2 bg-gray-700 rounded-lg font-bold text-sm">＋ 新規選手登録</button>
        </div>

        <button onclick="App.switchScreen('scan')" class="btn-3d btn-secondary w-full py-5 rounded-2xl text-xl font-black tracking-wide">📏 1. 身長スキャン</button>
        <button onclick="App.switchScreen('tests')" class="btn-3d btn-primary w-full py-5 rounded-2xl text-xl font-black tracking-wide">🚀 2. 測定ステーション</button>
        <div class="grid grid-cols-2 gap-4 mt-2">
          <button onclick="App.switchScreen('drill')" class="btn-3d bg-emerald-600 text-white rounded-xl py-3 font-bold border-2 border-emerald-400">🧘 AIドリル</button>
          <button onclick="App.switchScreen('record')" class="btn-3d bg-purple-600 text-white rounded-xl py-3 font-bold border-2 border-purple-400">📊 カルテ</button>

      </div>
    </div>

    <!-- 2. Scan Screen -->

        <video id="video-scan" class="hidden" autoplay playsinline></video>
        <canvas id="canvas-scan" class="absolute top-0 left-0 w-full h-full object-cover"></canvas>
        <div class="absolute inset-0 flex flex-col justify-end p-6 pb-12 pointer-events-none hud-overlay">

            <p class="text-sm">全身を枠内に入れ、カメラから約2m離れて直立してください。</p>
            <div class="w-full h-4 bg-gray-700 rounded-full mt-3 overflow-hidden border border-gray-500">

            <p id="scan-status" class="text-xs mt-1 text-gray-300">スタンバイ中...</p>

          <button onclick="App.switchScreen('lobby')" class="pointer-events-auto btn-3d bg-gray-700 w-full py-3 rounded-xl font-bold">戻る</button>

    <!-- 3. Tests Screen -->
    <div id="screen-tests" class="screen bg-black">

        <video id="video-tests" class="hidden" autoplay playsinline></video>
        <canvas id="canvas-tests" class="absolute top-0 left-0 w-full h-full object-cover"></canvas>
        
        <!-- UI Overlay -->

          <!-- State Indicator -->

            <div id="test-warning" class="hidden mt-4 bg-red-600 text-white font-bold px-6 py-3 rounded-full text-2xl border-4 border-white animate-pulse"></div>

            <div class="grid grid-cols-2 gap-2">

              <button onclick="TestManager.selectTest('tpose')" class="btn-3d bg-blue-900 border border-blue-500 p-2 rounded-lg font-bold">⚖️ Tポーズ</button>
              <button onclick="TestManager.selectTest('single_leg')" class="btn-3d bg-blue-900 border border-blue-500 p-2 rounded-lg font-bold">⚓ 片足立ち</button>
              <button onclick="TestManager.selectTest('x_factor')" class="btn-3d bg-blue-900 border border-blue-500 p-2 rounded-lg font-bold">🪑 骨盤制動</button>
            </div>

            <div class="flex gap-2">

              <button id="btn-start-test" onclick="TestManager.startTest()" class="btn-3d btn-primary flex-[2] py-4 rounded-xl font-black text-lg opacity-50 pointer-events-none">START</button>

    <!-- 4. Result Screen -->

        <button onclick="App.switchScreen('tests')" class="btn-3d bg-gray-700 w-full py-4 rounded-xl font-bold">再測定</button>
        <button onclick="App.switchScreen('lobby')" class="w-full py-2 text-gray-400 font-bold underline">ロビーへ戻る</button>
      </div>
    </div>

    <!-- 5. Drill Screen -->
    <div id="screen-drill" class="screen bg-black">
      <div class="relative flex-1 w-full h-full">
        <video id="video-drill" class="hidden" autoplay playsinline></video>
        <canvas id="canvas-drill" class="absolute top-0 left-0 w-full h-full object-cover"></canvas>
        <div id="drill-effect" class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-0 transition-opacity duration-300">
           <div class="w-64 h-64 border-8 border-emerald-400 rounded-full animate-ping"></div>
        </div>
        <div class="absolute inset-0 flex flex-col justify-end p-6 pb-12 pointer-events-none hud-overlay">
          <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-600 mb-4 text-center">
            <h3 class="text-xl font-bold text-emerald-400 mb-2">イス座り・胸回し体操</h3>
            <p class="text-xs mb-2">イスに座り、頭の後ろで手を組み、胸を大きく回して3秒キープ！</p>
            <div class="text-3xl font-black text-white" id="drill-angle">0°</div>
            <div class="w-full h-3 bg-gray-700 rounded-full mt-2 overflow-hidden border border-gray-500">
              <div id="drill-progress" class="h-full bg-emerald-400 w-0 transition-all duration-100"></div>
            </div>
            <p id="drill-msg" class="text-sm mt-1 text-yellow-300 font-bold">【🔒 あと--°で覚醒！】</p>
          </div>
          <button onclick="App.switchScreen('lobby')" class="pointer-events-auto btn-3d bg-gray-700 w-full py-3 rounded-xl font-bold">戻る</button>
        </div>
      </div>
    </div>

    <!-- 6. Record Screen -->
    <div id="screen-record" class="screen bg-[#0a0f1d] p-6 pt-16 flex flex-col pb-12 overflow-y-auto">
      <h2 class="text-2xl font-black text-yellow-400 mb-4">📈 成長カルテ</h2>
      
      <!-- Graph Area -->

        <h3 class="text-sm text-gray-400 font-bold mb-2">覚醒度推移</h3>

      <!-- History Table -->

          <div>日時</div><div>種目</div><div>スコア</div><div>動画</div>
        </div>
        <div id="record-list" class="flex-1 overflow-y-auto p-2 space-y-2">
          <!-- Injected via JS -->
        </div>
      </div>
      
      <div class="flex gap-2">
        <button onclick="RecordManager.exportCSV()" class="btn-3d bg-green-700 flex-1 py-3 rounded-xl font-bold border border-green-500">CSV出力</button>
        <button onclick="App.switchScreen('lobby')" class="btn-3d bg-gray-700 flex-1 py-3 rounded-xl font-bold">戻る</button>

    <!-- Sleep Overlay -->

      <p class="text-gray-500 mt-2">画面をタップして再開</p>
    </div>

    <!-- Modals -->
    <!-- New Player Modal -->
    <div id="modal-new-player" class="hidden absolute inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
      <div class="bg-gray-800 p-6 rounded-2xl w-full max-w-sm border-2 border-gray-600">
        <h3 class="text-xl font-bold mb-4">新規選手登録</h3>
        <input type="text" id="np-name" placeholder="選手名" class="w-full bg-gray-900 border border-gray-600 rounded p-3 mb-3 text-white">
        <input type="number" id="np-height" placeholder="実身長 (cm)" class="w-full bg-gray-900 border border-gray-600 rounded p-3 mb-3 text-white">
        <div class="flex gap-2 mt-4">
          <button onclick="UIManager.hideModal('modal-new-player')" class="flex-1 bg-gray-600 p-3 rounded font-bold">キャンセル</button>
          <button onclick="App.createPlayer()" class="flex-1 bg-yellow-500 text-black p-3 rounded font-bold">登録</button>
        </div>
      </div>

    <!-- Video Playback Modal -->
    <div id="modal-video" class="hidden absolute inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
      <button onclick="UIManager.hideModal('modal-video')" class="absolute top-6 right-6 bg-gray-800 text-white p-3 rounded-full font-bold z-10 border border-gray-600">✕ 閉じる</button>
      <div class="w-full max-w-md bg-black rounded-xl overflow-hidden border-2 border-gray-700 relative aspect-[9/16]">
        <video id="modal-video-player" class="w-full h-full object-cover" controls playsinline></video>
      </div>
    </div>

  </div>

  <script>
    /** =========================================================================
     * 0. グローバル定数・ユーティリティ・DB管理
     * ========================================================================= */
    const DB_NAME = 'BrainGPSDB';
    const STORE_VIDEOS = 'videos';

    // IndexedDB Wrapper for Video Storage
    const DBManager = {
      db: null,
      async init() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_VIDEOS)) db.createObjectStore(STORE_VIDEOS);
          };
          req.onsuccess = e => { this.db = e.target.result; resolve(); };
          req.onerror = e => reject(e);
        });
      },
      async saveVideo(id, blob) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(STORE_VIDEOS, 'readwrite');
          const req = tx.objectStore(STORE_VIDEOS).put(blob, id);
          req.onsuccess = () => resolve();
          req.onerror = e => reject(e);
        });
      },
      async getVideo(id) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(STORE_VIDEOS, 'readonly');
          const req = tx.objectStore(STORE_VIDEOS).get(id);
          req.onsuccess = e => resolve(e.target.result);
          req.onerror = e => reject(e);
        });
      },
      async deleteVideo(id) {
        return new Promise((resolve) => {
          const tx = this.db.transaction(STORE_VIDEOS, 'readwrite');
          tx.objectStore(STORE_VIDEOS).delete(id);
          tx.oncomplete = () => resolve();
        });
      }
    };

    const StorageUtils = {
      get(key, def) { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; },
      set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
    };

    const MathUtils = {
      dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); },
      angle(p1, p2) { return Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI; },
      angle3D(p1, p2) { return Math.atan2(p2.z - p1.z, p2.x - p1.x) * 180 / Math.PI; },
      avg(arr) { return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; },
      median(arr) { if(!arr.length) return 0; const s = [...arr].sort((a,b)=>a-b); const m = Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
    };

    // Filter for sensor noise
    class DataFilter {
      constructor(size = 10) { this.size = size; this.data = []; }
      push(val) { this.data.push(val); if(this.data.length > this.size) this.data.shift(); }
      getAverage() { return MathUtils.avg(this.data); }
      getMedian() { return MathUtils.median(this.data); }
      clear() { this.data = []; }
      isFull() { return this.data.length >= this.size; }
    }

    /** =========================================================================
     * 1. 状態管理 (State Manager)
     * ========================================================================= */
    const AppState = {
      players: [],
      currentPlayerId: null,
      facingMode: 'user', // user or environment
      currentScreen: 'lobby',
      isSleeping: false,
      
      // Player Data Format: { id, name, height, pxPerCm, initialShoulderW, initialPelvisW, records: [] }
      load() {
        this.players = StorageUtils.get('gps_players', []);
        this.currentPlayerId = StorageUtils.get('gps_current_player', null);
      },
      save() {
        StorageUtils.set('gps_players', this.players);
        StorageUtils.set('gps_current_player', this.currentPlayerId);
      },
      getCurrentPlayer() {
        return this.players.find(p => p.id === this.currentPlayerId);
      },
      updateCurrentPlayer(data) {
        const p = this.getCurrentPlayer();
        if (p) { Object.assign(p, data); this.save(); }
      }
    };

    /** =========================================================================
     * 2. マネージャー群 (Speech, Timer, Camera)
     * ========================================================================= */
    const SpeechManager = {
      ctx: null, unlocked: false, isSpeaking: false,
      unlock() {
        if(this.unlocked) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.ctx.resume();
        const u = new SpeechSynthesisUtterance('');
        u.volume = 0; window.speechSynthesis.speak(u);
        this.unlocked = true;
      },
      speak(text, cancelPrev = true) {
        if(!this.unlocked) this.unlock();
        if(cancelPrev) window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        u.rate = 1.1;
        u.onstart = () => { this.isSpeaking = true; };
        u.onend = () => { this.isSpeaking = false; };
        window.speechSynthesis.speak(u);
      },
      playBeep(freq = 800, type = 'sine', duration = 0.1) {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type; osc.frequency.value = freq;
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
        setTimeout(() => osc.stop(), duration * 1000);
      },
      stopAll() {
        window.speechSynthesis.cancel();
        this.isSpeaking = false;
      }
    };

    const TimerManager = {
      timeouts: new Set(), intervals: new Set(), rafId: null,
      setTimeout(cb, ms) { const id = setTimeout(cb, ms); this.timeouts.add(id); return id; },
      setInterval(cb, ms) { const id = setInterval(cb, ms); this.intervals.add(id); return id; },
      requestAnimationFrame(cb) { this.rafId = requestAnimationFrame(cb); return this.rafId; },
      clearAll() {
        this.timeouts.forEach(id => clearTimeout(id)); this.timeouts.clear();
        this.intervals.forEach(id => clearInterval(id)); this.intervals.clear();
        if(this.rafId) cancelAnimationFrame(this.rafId); this.rafId = null;
      }
    };

    const CameraManager = {
      stream: null, videoEl: null, isActive: false,
      async start(videoElementId, facingMode = 'user') {
        this.stop();
        this.videoEl = document.getElementById(videoElementId);
        try {
          this.stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingMode, width: { ideal: 720 }, height: { ideal: 1280 } },
            audio: false
          });
          this.videoEl.srcObject = this.stream;
          await new Promise(res => { this.videoEl.onloadedmetadata = res; });
          this.videoEl.play();
          this.isActive = true;
          // Canvas mirror adjustment based on facingMode is handled in drawing
        } catch (e) {
          console.error("Camera Error:", e);
          alert("カメラの起動に失敗しました。権限を確認してください。");
        }
      },
      stop() {
        if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
        if (this.videoEl) { this.videoEl.srcObject = null; this.videoEl = null; }
        this.isActive = false;
      },
      pause() { if (this.stream) this.stream.getVideoTracks().forEach(t => t.enabled = false); },
      resume() { if (this.stream) this.stream.getVideoTracks().forEach(t => t.enabled = true); }
    };

    const RecordManager = {
      mediaRecorder: null, recordedChunks: [], blob: null, blobUrl: null,
      start(canvasEl) {
        this.recordedChunks = [];
        const stream = canvasEl.captureStream(30);
        try {
          this.mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
        } catch (e) {
          this.mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/mp4' }); // fallback for iOS
        }
        this.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) this.recordedChunks.push(e.data); };
        this.mediaRecorder.start();
      },
      async stop() {
        return new Promise(resolve => {
          if (!this.mediaRecorder || this.mediaRecorder.state === 'inactive') return resolve(null);
          this.mediaRecorder.onstop = () => {
            this.blob = new Blob(this.recordedChunks, { type: this.mediaRecorder.mimeType });
            this.blobUrl = URL.createObjectURL(this.blob);
            resolve(this.blob);
          };
          this.mediaRecorder.stop();
        });
      }
    };

    /** =========================================================================
     * 3. MediaPipe 推論エンジン (BiomechanicsEngine)
     * ========================================================================= */
    const BiomechanicsEngine = {
      pose: null, onResultsCallback: null, canvasCtx: null, currentCanvas: null,
      init() {
        this.pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        this.pose.setOptions({
          modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
        });
        this.pose.onResults(res => this.handleResults(res));
      },
      async processFrame(videoEl, canvasEl) {
        if(!this.pose || !CameraManager.isActive) return;
        this.currentCanvas = canvasEl;
        this.canvasCtx = canvasEl.getContext('2d');
        // Set canvas size to match video
        if(canvasEl.width !== videoEl.videoWidth) {
          canvasEl.width = videoEl.videoWidth;
          canvasEl.height = videoEl.videoHeight;
        }
        await this.pose.send({image: videoEl});
      },
      handleResults(results) {
        if(!this.canvasCtx || !this.currentCanvas) return;
        const ctx = this.canvasCtx;
        const w = this.currentCanvas.width;
        const h = this.currentCanvas.height;

        ctx.save();
        ctx.clearRect(0, 0, w, h);
        
        // Handle Mirroring for User Facing Camera
        if(AppState.facingMode === 'user') {
          ctx.translate(w, 0);
          ctx.scale(-1, 1);
        }

        ctx.drawImage(results.image, 0, 0, w, h);

        if (results.poseLandmarks) {
          drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
          drawLandmarks(ctx, results.poseLandmarks, {color: '#FF0000', lineWidth: 2, radius: 4});
        }
        ctx.restore();

        // Convert normalized coordinates to pixel coordinates for internal use
        let pxLandmarks = null;
        if(results.poseLandmarks) {
          pxLandmarks = results.poseLandmarks.map(l => ({
            x: AppState.facingMode === 'user' ? (1 - l.x) * w : l.x * w, // Flip X logic if user facing
            y: l.y * h,
            z: l.z, visibility: l.visibility
          }));
        }

        if(this.onResultsCallback) this.onResultsCallback(pxLandmarks);
      }
    };

    /** =========================================================================
     * 4. 画面・UI制御 (UIManager, App)
     * ========================================================================= */
    const UIManager = {
      showModal(id) { document.getElementById(id).classList.remove('hidden'); },
      hideModal(id) { document.getElementById(id).classList.add('hidden'); },
      updatePlayerSelect() {

    };

    const App = {
      async init() {
        await DBManager.init();
        AppState.load();
        UIManager.updatePlayerSelect();
        BiomechanicsEngine.init();

            AppState.isSleeping = true;

      },

      toggleCameraFacing() {
        AppState.facingMode = AppState.facingMode === 'user' ? 'environment' : 'user';

      createPlayer() {

        }

        if(target === 'scan') ScanManager.start();
        else if(target === 'tests') TestManager.init();
        else if(target === 'drill') DrillManager.start();
        else if(target === 'record') RecordManagerView.render();
      }
    };

    /** =========================================================================
     * 5. 各画面のビジネスロジック
     * ========================================================================= */
    
    // --- スキャン画面 ---
    const ScanManager = {
      stableFrames: 0,
      async start() {
        this.stableFrames = 0;
        document.getElementById('scan-progress').style.width = '0%';
        document.getElementById('scan-status').innerText = 'スタンバイ中...全身を入れてください';
        await CameraManager.start('video-scan', AppState.facingMode);
        BiomechanicsEngine.onResultsCallback = (lm) => this.onFrame(lm);
        this.loop();
        SpeechManager.speak("全身を枠内に入れて静止してください。");
      },
      loop() {
        if(AppState.currentScreen !== 'scan') return;
        BiomechanicsEngine.processFrame(document.getElementById('video-scan'), document.getElementById('canvas-scan'));
        TimerManager.requestAnimationFrame(() => this.loop());
      },
      onFrame(landmarks) {
        if(!landmarks) return;
        // Check visibility of key points (head, shoulders, hips, ankles)
        const keys = [0, 11, 12, 23, 24, 27, 28];
        const allVisible = keys.every(i => landmarks[i] && landmarks[i].visibility > 0.7);

        if(allVisible) {
          this.stableFrames++;
          const progress = Math.min((this.stableFrames / 30) * 100, 100);
          document.getElementById('scan-progress').style.width = `${progress}%`;
          if(this.stableFrames === 30) this.lockAndSave(landmarks);
        } else {
          this.stableFrames = 0;
          document.getElementById('scan-progress').style.width = '0%';
        }
      },
      lockAndSave(lm) {
        BiomechanicsEngine.onResultsCallback = null;
        const player = AppState.getCurrentPlayer();
        
        // Calculate pxPerCm (Top of head to heel avg)
        const topY = lm[0].y - 20; // Approx top of head
        const heelY = (lm[29].y + lm[30].y) / 2;
        const pixelHeight = heelY - topY;
        const pxPerCm = pixelHeight / player.height;

        const shoulderW = MathUtils.dist(lm[11], lm[12]);
        const pelvisW = MathUtils.dist(lm[23], lm[24]);

        AppState.updateCurrentPlayer({ pxPerCm, initialShoulderW: shoulderW, initialPelvisW: pelvisW });
        
        SpeechManager.playBeep(1000, 'sine', 0.2);
        SpeechManager.speak("スキャン完了です。測定ステーションへ進みます。");
        document.getElementById('scan-status').innerText = 'スキャン完了！';
        
        TimerManager.setTimeout(() => App.switchScreen('tests'), 2000);
      }
    };

    // --- 測定ステーション画面 ---
    const TestManager = {
      currentTestType: null, state: 'idle', // idle, standby, countdown, grace, testing, complete
      startTime: 0, testDuration: 0, initialData: null, resultData: null,
      filters: {}, stableFrames: 0, metronomeId: null,

      init() {
        this.currentTestType = null;
        this.state = 'idle';
        document.getElementById('test-hud').classList.add('hidden');
        document.getElementById('btn-start-test').classList.add('opacity-50', 'pointer-events-none');
        document.getElementById('selected-test-info').innerText = '種目を選択してください';
        document.querySelectorAll('#test-controls button.btn-3d').forEach(b => b.classList.remove('ring-4', 'ring-yellow-400'));
      },
      selectTest(type) {
        this.currentTestType = type;
        document.querySelectorAll('#test-controls button.btn-3d').forEach(b => b.classList.remove('ring-4', 'ring-yellow-400'));
        event.currentTarget.classList.add('ring-4', 'ring-yellow-400');
        document.getElementById('btn-start-test').classList.remove('opacity-50', 'pointer-events-none');
        
        const info = {
          'stepping': '目隠し足踏み (15秒) : 左右・前後ブレ、骨盤回旋',
          'tpose': 'Tポーズ (6秒) : 肩甲骨水平維持',
          'single_leg': '片足立ち (最大15秒) : 着地検知、重心動揺',
          'x_factor': '骨盤制動 (10秒) : 胸椎捻転分離度'
        };
        document.getElementById('selected-test-info').innerText = info[type];
      },
      async startTest() {
        if(!AppState.getCurrentPlayer().pxPerCm) return alert('先に身長スキャンを行ってください。');
        
        document.getElementById('test-controls').classList.add('hidden');
        document.getElementById('test-hud').classList.remove('hidden');
        
        await CameraManager.start('video-tests', AppState.facingMode);
        BiomechanicsEngine.onResultsCallback = (lm) => this.onFrame(lm);
        
        this.state = 'standby';
        this.stableFrames = 0;
        this.showWarning('全身を入れて静止してください', false);
        SpeechManager.speak("全身を枠内に入れて静止してください。");
        
        this.loop();
      },
      loop() {
        if(AppState.currentScreen !== 'tests') return;
        BiomechanicsEngine.processFrame(document.getElementById('video-tests'), document.getElementById('canvas-tests'));
        TimerManager.requestAnimationFrame(() => this.loop());
      },
      
      onFrame(landmarks) {
        if(!landmarks) return;
        const now = Date.now();

        if(this.state === 'standby') {
          // 12 frames stable check
          const keys = [0, 11, 12, 23, 24, 27, 28];
          if(keys.every(i => landmarks[i] && landmarks[i].visibility > 0.7)) {
            this.stableFrames++;
            if(this.stableFrames >= 12) {
              this.startCountdown(landmarks);
            }
          } else {
            this.stableFrames = 0;
          }
        }
        else if(this.state === 'testing' || this.state === 'grace') {
          this.processTestLogic(landmarks, now);
        }
      },

      startCountdown(landmarks) {
        this.state = 'countdown';
        this.hideWarning();
        let count = 3;
        const cdEl = document.getElementById('test-countdown');
        
        // Save initial pose as baseline
        this.initialData = {
          pelvisCenter: { x: (landmarks[23].x + landmarks[24].x)/2, y: (landmarks[23].y + landmarks[24].y)/2 },
          shoulderW: MathUtils.dist(landmarks[11], landmarks[12]),
          pelvisW: MathUtils.dist(landmarks[23], landmarks[24]),
          pelvisAngleZ: MathUtils.angle3D(landmarks[23], landmarks[24]),
          headXMin: landmarks[0].x, headXMax: landmarks[0].x
        };
        
        // Initialize Filters
        this.filters = {
          pelvisZ: new DataFilter(10), pelvisW: new DataFilter(10), shoulderW: new DataFilter(10),
          leftArmA: new DataFilter(10), rightArmA: new DataFilter(10), wristDiff: new DataFilter(10),
          xFactor: new DataFilter(10)
        };

        const tick = () => {
          if(count > 0) {
            cdEl.innerText = count;
            SpeechManager.playBeep(600, 'sine', 0.1);
            count--;
            TimerManager.setTimeout(tick, 1000);
          } else {
            cdEl.innerText = 'GO!';
            SpeechManager.playBeep(1200, 'square', 0.3);
            TimerManager.setTimeout(() => cdEl.innerText = '', 1000);
            this.beginMeasurement();
          }
        };
        tick();
      },

      beginMeasurement() {
        this.state = 'grace';
        this.startTime = Date.now();
        const config = { 'stepping': 15, 'tpose': 6, 'single_leg': 15, 'x_factor': 10 };
        this.testDuration = config[this.currentTestType];
        
        // Start Recording
        RecordManager.start(document.getElementById('canvas-tests'));
        
        if(this.currentTestType === 'stepping') {
          // Metronome 100BPM -> 600ms
          this.metronomeId = TimerManager.setInterval(() => SpeechManager.playBeep(400, 'sine', 0.05), 600);
        }
        
        TimerManager.setTimeout(() => { if(this.state === 'grace') this.state = 'testing'; }, 1500); // Grace end
        
        // Timer Loop
        const timerLoop = () => {
          if(this.state !== 'testing' && this.state !== 'grace') return;
          const elapsed = (Date.now() - this.startTime) / 1000;
          const remain = Math.ceil(this.testDuration - elapsed);
          
          if(remain === 3 && elapsed % 1 < 0.1) SpeechManager.speak("3", true);
          if(remain === 2 && elapsed % 1 < 0.1) SpeechManager.speak("2", true);
          if(remain === 1 && elapsed % 1 < 0.1) SpeechManager.speak("1", true);

          if(elapsed >= this.testDuration) {
            this.endTest('success');
          } else {
            TimerManager.setTimeout(timerLoop, 100);
          }
        };
        timerLoop();
      },

      processTestLogic(lm, now) {
        const p = AppState.getCurrentPlayer();
        const px2cm = p.pxPerCm;
        const curPelvisC = { x: (lm[23].x + lm[24].x)/2, y: (lm[23].y + lm[24].y)/2 };
        const curPelvisW = MathUtils.dist(lm[23], lm[24]);
        const curShoulderW = MathUtils.dist(lm[11], lm[12]);
        
        // Update basic filters
        this.filters.pelvisW.push(curPelvisW);
        this.filters.shoulderW.push(curShoulderW);
        this.filters.pelvisZ.push(MathUtils.angle3D(lm[23], lm[24]));

        // Global Safeguards (Out of frame or Dash)
        if(this.state === 'testing') {
          // Dash check (Scale > 1.7)
          const scaleChange = ((curPelvisW / p.initialPelvisW) + (curShoulderW / p.initialShoulderW)) / 2;
          if(scaleChange > 1.7) return this.endTest('danger', '🚨 前方へ突進強制終了！');
          // Out of frame
          if(lm[0].x < 0 || lm[0].x > this.currentCanvas?.width) return this.endTest('danger', '🚨 枠外逸脱！');
        }

        // Test Specific Logic
        if(this.currentTestType === 'stepping') {
          // Calc for final result done at end using filters
        }
        else if(this.currentTestType === 'tpose') {
          const lArmA = MathUtils.angle(lm[11], lm[15]);
          const rArmA = MathUtils.angle(lm[12], lm[16]);
          const wDiff = Math.abs(lm[15].y - lm[16].y) / px2cm;
          this.filters.leftArmA.push(lArmA);
          this.filters.rightArmA.push(rArmA);
          this.filters.wristDiff.push(wDiff);
        }
        else if(this.currentTestType === 'single_leg') {
          this.initialData.headXMin = Math.min(this.initialData.headXMin, lm[0].x);
          this.initialData.headXMax = Math.max(this.initialData.headXMax, lm[0].x);
          
          if(this.state === 'testing') {
            // Touchdown detection
            const leftAnkleY = lm[27].y;
            const rightAnkleY = lm[28].y;
            const yDiff = Math.abs(leftAnkleY - rightAnkleY) / px2cm;
            if(yDiff < 5) { // cm threshold
              this.endTest('touchdown');
            }
          }
        }
        else if(this.currentTestType === 'x_factor') {
          const shAngle = MathUtils.angle3D(lm[11], lm[12]);
          const pvAngle = MathUtils.angle3D(lm[23], lm[24]);
          this.filters.xFactor.push(Math.abs(shAngle - pvAngle));
        }
      },

      async endTest(reason, msg = '') {
        this.state = 'complete';
        if(this.metronomeId) clearInterval(this.metronomeId);
        
        SpeechManager.playBeep(400, 'sine', 0.5);
        SpeechManager.speak("終了です。目を開けてリプレイを確認してください。");
        if(msg) this.showWarning(msg, true);

        const elapsed = Math.min((Date.now() - this.startTime) / 1000, this.testDuration);
        const p = AppState.getCurrentPlayer();
        const px2cm = p.pxPerCm;
        
        // Calculate Results based on filters and type
        let score = 100;
        let details = {};

        if(this.currentTestType === 'stepping') {
          const curPelvisC = this.initialData.pelvisCenter; // using last known roughly, better to use current frame but let's assume it was tracked
          const currentLandmarks = BiomechanicsEngine.pose.lastResults?.poseLandmarks; // mock access, we use filters where possible
          let shiftX = 0, fwd = 0;
          if(currentLandmarks) {
             const cx = (currentLandmarks[23].x + currentLandmarks[24].x)/2;
             shiftX = (cx - this.initialData.pelvisCenter.x) / px2cm;
          }
          const scaleChange = ((this.filters.pelvisW.getAverage() / p.initialPelvisW) + (this.filters.shoulderW.getAverage() / p.initialShoulderW)) / 2;
          fwd = 200 * Math.max(0, (1 - 1/scaleChange)); // approx 200cm base
          const rot = Math.abs(this.filters.pelvisZ.getAverage() - this.initialData.pelvisAngleZ);
          
          score -= (Math.abs(shiftX)*0.5 + fwd*0.3 + rot*0.5);
          details = { "左右ブレ": `${shiftX.toFixed(1)} cm`, "前後突進": `${fwd.toFixed(1)} cm`, "骨盤回旋": `${rot.toFixed(1)} °` };
        }
        else if(this.currentTestType === 'tpose') {
          const lA = this.filters.leftArmA.getAverage();
          const rA = this.filters.rightArmA.getAverage();
          const wD = this.filters.wristDiff.getAverage();
          const lErr = Math.abs(180 - Math.abs(lA)); // target 180 or 0 depending on side
          const rErr = Math.abs(0 - Math.abs(rA));
          score -= (lErr + rErr + wD*2);
          details = { "左腕誤差": `${lErr.toFixed(1)} °`, "右腕誤差": `${rErr.toFixed(1)} °`, "手首高低差": `${wD.toFixed(1)} cm` };
        }
        else if(this.currentTestType === 'single_leg') {
          const sway = (this.initialData.headXMax - this.initialData.headXMin) / px2cm;
          score = (elapsed / 15) * 100 - sway*2;
          details = { "耐久時間": `${elapsed.toFixed(1)} 秒`, "重心動揺幅": `${sway.toFixed(1)} cm` };
        }
        else if(this.currentTestType === 'x_factor') {
          const xf = this.filters.xFactor.getAverage();
          score = Math.min(100, xf * 2); // 50deg is 100%
          details = { "最大X-Factor": `${xf.toFixed(1)} °` };
        }

        score = Math.max(0, Math.min(100, Math.round(score)));
        this.resultData = { type: this.currentTestType, score, details, date: new Date().toISOString() };

        // Stop Recording and save
        const videoBlob = await RecordManager.stop();
        if(videoBlob) {
          const videoId = 'vid_' + Date.now();
          await DBManager.saveVideo(videoId, videoBlob);
          this.resultData.videoId = videoId;
        }

        TimerManager.setTimeout(() => {
          ResultManager.showResult(this.resultData, RecordManager.blobUrl);
        }, 2000);
      },

      showWarning(msg, pulse) {
        const el = document.getElementById('test-warning');
        el.innerText = msg;
        el.classList.remove('hidden');
        if(pulse) el.classList.add('animate-pulse'); else el.classList.remove('animate-pulse');
      },
      hideWarning() { document.getElementById('test-warning').classList.add('hidden'); }
    };

    // --- 結果画面 ---
    const ResultManager = {
      currentResult: null,
      showResult(resultData, videoUrl) {
        this.currentResult = resultData;
        App.switchScreen('result');
        
        document.getElementById('result-score').innerText = resultData.score;

      saveToRecord() {

    // --- ドリル画面 ---
    const DrillManager = {
      async start() {

      onFrame(lm) {

          document.getElementById('drill-effect').style.opacity = '0';

      }
    };

    // --- カルテ画面 ---
    const RecordManagerView = {
      render() {
        const p = AppState.getCurrentPlayer();
        if(!p) return;
        
        // Draw Graph
        const svg = document.getElementById('chart-svg');
        svg.innerHTML = '';
        if(p.records.length > 0) {
          let points = '';
          const w = 100, h = 100;
          const step = p.records.length > 1 ? w / (p.records.length - 1) : w;
          p.records.forEach((r, i) => {
            const x = i * step;
            const y = h - (r.score / 100 * h);
            points += `${x},${y} `;
            svg.innerHTML += `<circle cx="${x}" cy="${y}" r="3" fill="#fcd34d" />`;
          });
          svg.innerHTML = `<polyline fill="none" stroke="#38bdf8" stroke-width="2" points="${points}" />` + svg.innerHTML;
        }

        // Render Table
        const listEl = document.getElementById('record-list');
        listEl.innerHTML = '';
        [...p.records].reverse().forEach(r => {
          const d = new Date(r.date);
          const dStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
          const types = {'stepping':'足踏み', 'tpose':'Tポーズ', 'single_leg':'片足', 'x_factor':'制動'};
          
          let btnHtml = r.videoId ? `<button onclick="RecordManagerView.playVideo('${r.videoId}')" class="bg-blue-600 text-white rounded px-2 py-1 text-xs font-bold">🎬 再生</button>` : '-';
          
          listEl.innerHTML += `
            <div class="grid grid-cols-4 text-xs text-center items-center py-2 border-b border-gray-700 bg-gray-800/50">
              <div class="text-gray-400">${dStr}</div>
              <div>${types[r.type]}</div>
              <div class="font-bold text-yellow-400">${r.score}</div>
              <div>${btnHtml}</div>
            </div>
          `;
        });
      },
      async playVideo(id) {
        const blob = await DBManager.getVideo(id);
        if(blob) {
          const url = URL.createObjectURL(blob);
          const vid = document.getElementById('modal-video-player');
          vid.src = url;
          UIManager.showModal('modal-video');
          vid.play();
        } else {
          alert('動画データが見つかりません');
        }
      },
      exportCSV() {
        const p = AppState.getCurrentPlayer();
        if(!p || p.records.length === 0) return alert('データがありません');
        
        let csv = "日時,種目,スコア,詳細\n";
        p.records.forEach(r => {
          const detailStr = Object.entries(r.details).map(([k,v]) => `${k}:${v}`).join(' / ');
          csv += `${r.date},${r.type},${r.score},"${detailStr}"\n`;
        });
        
        const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `${p.name}_カルテ.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    };

    // DOM Ready Initialization
    document.addEventListener('DOMContentLoaded', () => App.init());

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('SW registered: ', reg);
        }).catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }

  </script>
</body>
</html>
