<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>脳内GPS＆身体図式ドック - BRAWL BODY</title>
  
  <!-- Google Fonts & MediaPipe Pose -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chango&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-navy: #0a0f1d;
      --card-bg: rgba(16, 26, 50, 0.88);
      --accent-purple: #9d4edd;
      --accent-cyan: #00f0ff;
      --accent-yellow: #ffd000;
      --accent-green: #00ff88;
      --text-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-navy);
      color: var(--text-white);
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }

    /* サンバースト背景演出 */
    .sunburst-bg {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(157, 78, 221, 0.05) 0deg 15deg,
        rgba(0, 240, 255, 0.02) 15deg 30deg
      );
      animation: rotateBg 120s linear infinite;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes rotateBg {
      100% { transform: rotate(360deg); }
    }

    /* メインコンテナ（1画面完結レイアウト） */
    #app-container {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1;
      padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 14px) 16px;
    }

    /* ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 48px;
    }
    .logo-badge {
      font-family: 'Chango', cursive;
      font-size: 1.25rem;
      background: linear-gradient(180deg, #ffd000, #ff8800);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 0 #000);
      letter-spacing: 1px;
    }
    .user-tag {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--accent-cyan);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 900;
      color: var(--accent-cyan);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    /* メインビューポートエリア（カメラ・リプレイ兼用） */
    #viewport-card {
      position: relative;
      flex: 1;
      margin: 8px 0;
      background: #000;
      border-radius: 20px;
      border: 3px solid #1f2f57;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 0 16px rgba(0,240,255,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video#webcam, canvas#output-canvas, video#replay-video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 自撮り鏡面反転 */
    }
    video#replay-video {
      display: none;
      z-index: 4;
      transform: none; /* 録画映像は自然な方向 */
    }

    /* オーバーレイUI */
    .hud-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .status-badge {
      background: rgba(10, 15, 29, 0.85);
      padding: 6px 12px;
      border-radius: 12px;
      border-left: 4px solid var(--accent-yellow);
      font-size: 0.8rem;
      font-weight: 900;
    }
    .status-badge.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      box-shadow: 0 0 12px rgba(0,255,136,0.3);
    }
    .hud-center-alert {
      align-self: center;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 20px var(--accent-purple);
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      border-radius: 16px;
      backdrop-filter: blur(4px);
    }

    /* 下部コントロール＆メーター */
    #dashboard-panel {
      background: var(--card-bg);
      border: 2px solid #233663;
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .test-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .nav-btn {
      background: #15223e;
      border: 2px solid #2b4270;
      border-bottom: 4px solid #111b33;
      color: #7b93c7;
      padding: 8px 4px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 900;
      text-align: center;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .nav-btn.active {
      background: #3c1361;
      border-color: var(--accent-purple);
      border-bottom-color: #200636;
      color: #fff;
      box-shadow: 0 0 10px rgba(157, 78, 221, 0.4);
    }
    .nav-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    /* メインアクション3Dボタン */
    .brawl-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(180deg, #ffd000 0%, #ff8800 100%);
      color: #4a2600;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #b35900, 0 8px 16px rgba(0,0,0,0.4);
      transition: all 0.08s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      letter-spacing: 0.5px;
    }
    .brawl-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b35900, 0 4px 8px rgba(0,0,0,0.4);
    }
    .brawl-btn.secondary {
      background: linear-gradient(180deg, #00f0ff 0%, #0088cc 100%);
      color: #002e48;
      box-shadow: 0 6px 0 #005f8f, 0 8px 16px rgba(0,0,0,0.4);
    }
    .brawl-btn.secondary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #005f8f;
    }

    /* モーダル（設定・カルテ・ドリル） */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 10, 20, 0.85);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .modal-card {
      width: 100%;
      max-width: 360px;
      background: #111a33;
      border: 3px solid var(--accent-cyan);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0,240,255,0.3);
      text-align: center;
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--accent-yellow);
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .input-field {
      width: 80%;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #233663;
      background: #080d1a;
      color: #fff;
      font-size: 1.3rem;
      text-align: center;
      font-weight: 900;
      margin: 12px 0 16px 0;
    }
  </style>
</head>
<body>

  <div class="sunburst-bg"></div>

  <div id="app-container">
    <!-- ヘッダー -->
    <header>
      <div class="logo-badge">⚡ BRAWL BODY</div>
      <div class="user-tag" id="user-display">👤 身長: 145cm</div>
    </header>

    <!-- ビューポート（カメラ/キャンバス/録画リプレイ） -->
    <div id="viewport-card">
      <video id="webcam" playsinline webkit-playsinline muted autoplay></video>
      <canvas id="output-canvas"></canvas>
      <video id="replay-video" playsinline webkit-playsinline controls></video>

      <div class="hud-overlay">
        <div class="hud-top">
          <div class="status-badge" id="hud-status">STANDBY</div>
          <div class="status-badge" id="hud-metric">Z-SHIFT: 0.0cm</div>
        </div>
        <div class="hud-center-alert" id="hud-center">カメラを全身に合わせてね！</div>
        <div style="height: 10px;"></div>
      </div>
    </div>

    <!-- コントロールダッシュボード -->
    <div id="dashboard-panel">
      <!-- 4大テスト選択タブ -->
      <div class="test-nav">
        <button class="nav-btn active" id="tab-test-1" onclick="switchTest(1)">👣 足踏み<br>(骨盤GPS)</button>
        <button class="nav-btn" id="tab-test-2" onclick="switchTest(2)">⚖️ Tポーズ<br>(肩甲骨)</button>
        <button class="nav-btn" id="tab-test-3" onclick="switchTest(3)">⚓ 片足立ち<br>(足裏)</button>
        <button class="nav-btn" id="tab-test-4" onclick="switchTest(4)">🪑 骨盤制動<br>(X-Factor)</button>
      </div>

      <!-- メイン起動ボタン群 -->
      <div style="display: flex; gap: 8px;">
        <button class="brawl-btn" id="action-btn" onclick="handlePrimaryAction()">🚀 直立スキャン開始</button>
        <button class="brawl-btn secondary" style="width: 70px;" onclick="openDrillModal()">🪑</button>
      </div>
    </div>
  </div>

  <!-- 身長設定モーダル -->
  <div class="modal-overlay" id="height-modal">
    <div class="modal-card">
      <div class="modal-title">📏 身長キャリブレーション</div>
      <p style="font-size: 0.85rem; color: #a0aec0;">カメラに絶対基準（モノサシ）を与えて、実寸cmのズレを暴きます！</p>
      <input type="number" id="input-height" class="input-field" value="145" min="80" max="220">
      <button class="brawl-btn" onclick="saveHeight()">セット完了！</button>
    </div>
  </div>

  <!-- 1分ドリル モーダル -->
  <div class="modal-overlay" id="drill-modal">
    <div class="modal-card">
      <div class="modal-title">🪑 イス座り胸回しドリル</div>
      <p style="font-size: 0.85rem; color: #cbd5e0; line-height: 1.4;">
        イスに浅く座って骨盤を完全ロック！<br>
        骨盤を正面に向けたまま、胸郭だけを左右にひねろう。<br>
        <strong>グリーン発光でキープすれば脳内GPSが再配線！</strong>
      </p>
      <div style="margin: 20px 0; font-size: 1.6rem; font-weight: 900; color: var(--accent-cyan);" id="drill-status">
        角度: 0° / 目標: 35°
      </div>
      <button class="brawl-btn secondary" onclick="closeDrillModal()">ドリル終了</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. 音響エンジン（Web Audio API Synthesizer & SpeechSynthesis）
       ========================================================================== */
    class AudioEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.15) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }
      playTick() { this.playTone(880, 'triangle', 0.05, 0.2); }
      playSuccess() {
        this.playTone(523.25, 'sine', 0.1, 0.2);
        setTimeout(() => this.playTone(659.25, 'sine', 0.1, 0.2), 100);
        setTimeout(() => this.playTone(783.99, 'sine', 0.25, 0.2), 200);
      }
      playAlert() {
        this.playTone(220, 'sawtooth', 0.3, 0.3);
      }
      speak(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const uttr = new SpeechSynthesisUtterance(text);
          uttr.lang = 'ja-JP';
          uttr.rate = 1.05;
          uttr.pitch = 1.1;
          window.speechSynthesis.speak(uttr);
        }
      }
    }
    const audio = new AudioEngine();

    /* ==========================================================================
       2. アプリ状態管理・定数
       ========================================================================== */
    const STATE = {
      CALIBRATING: 'CALIBRATING',
      STANDBY: 'STANDBY',
      COUNTDOWN: 'COUNTDOWN',
      TESTING: 'TESTING',
      REPLAY: 'REPLAY',
      DRILL: 'DRILL'
    };

    let currentState = STATE.STANDBY;
    let activeTest = 1;
    let userHeightCm = 145;
    let pxToCmRatio = null; // 身長cm / 直立時の全身ピクセル高
    let initialHipWidthPx = null;
    let initialShoulderWidthPx = null;
    let initialAnkleY = null;

    // 安定認識用フレームカウンタ
    let stablePoseFrames = 0;
    const REQUIRED_STABLE_FRAMES = 12;

    // テストタイマー・メトロノーム
    let testTimer = null;
    let metronomeInterval = null;
    let elapsedSeconds = 0;

    // メディアレコーダー
    let mediaRecorder = null;
    let recordedChunks = [];
    let replayBlobUrl = null;

    // DOM要素
    const videoEl = document.getElementById('webcam');
    const canvasEl = document.getElementById('output-canvas');
    const canvasCtx = canvasEl.getContext('2d');
    const replayVideoEl = document.getElementById('replay-video');
    const hudStatus = document.getElementById('hud-status');
    const hudMetric = document.getElementById('hud-metric');
    const hudCenter = document.getElementById('hud-center');
    const actionBtn = document.getElementById('action-btn');
    const userDisplay = document.getElementById('user-display');

    /* ==========================================================================
       3. MediaPipe Pose セットアップ & カメラ初期化
       ========================================================================== */
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    pose.onResults(onPoseResults);

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 720 },
            height: { ideal: 1280 }
          },
          audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();

        // Canvasサイズ初期化
        canvasEl.width = videoEl.videoWidth || 720;
        canvasEl.height = videoEl.videoHeight || 1280;

        // レコーダー準備（Canvas + Stream合成）
        initMediaRecorder();

        // MediaPipe連続推論ループ
        requestAnimationFrame(processVideoFrame);
      } catch (err) {
        hudCenter.innerText = "カメラの起動に失敗しました。設定を確認してください。";
      }
    }

    async function processVideoFrame() {
      if (videoEl.readyState >= 2) {
        await pose.send({ image: videoEl });
      }
      requestAnimationFrame(processVideoFrame);
    }

    /* ==========================================================================
       4. ポーズ解析 ＆ コア幾何学ロジック
       ========================================================================== */
    function onPoseResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      if (!results.poseLandmarks) {
        stablePoseFrames = 0;
        canvasCtx.restore();
        return;
      }

      const lm = results.poseLandmarks;
      const w = canvasEl.width;
      const h = canvasEl.height;

      // 重要ランドマークの抽出
      const nose = lm[0];
      const leftShoulder = lm[11];
      const rightShoulder = lm[12];
      const leftElbow = lm[13];
      const rightElbow = lm[14];
      const leftWrist = lm[15];
      const rightWrist = lm[16];
      const leftHip = lm[23];
      const rightHip = lm[24];
      const leftAnkle = lm[27];
      const rightAnkle = lm[28];
      const leftHeel = lm[29];
      const rightHeel = lm[30];

      // 全身認識チェック（頭頂部〜足首・踵が画面に収まっているか）
      const isFullBodyVisible = 
        nose.visibility > 0.6 &&
        leftShoulder.visibility > 0.6 && rightShoulder.visibility > 0.6 &&
        leftHip.visibility > 0.6 && rightHip.visibility > 0.6 &&
        leftAnkle.visibility > 0.6 && rightAnkle.visibility > 0.6;

      if (isFullBodyVisible) {
        stablePoseFrames++;
      } else {
        stablePoseFrames = 0;
      }

      // 骨格描画（通常時：シアン/パープル、ドリル整合時：エメラルドグリーン）
      const isGreenAlign = (currentState === STATE.DRILL && checkDrillAlignment(lm));
      drawSkeleton(lm, w, h, isGreenAlign ? '#00ff88' : '#00f0ff');

      // 状態別ロジック
      if (currentState === STATE.CALIBRATING) {
        handleCalibration(lm, h);
      } else if (currentState === STATE.TESTING) {
        executeActiveTestLogic(lm, w, h);
      } else if (currentState === STATE.DRILL) {
        executeDrillTracking(lm);
      }

      canvasCtx.restore();
    }

    /* 骨格のレンダリング */
    function drawSkeleton(landmarks, w, h, color) {
      canvasCtx.strokeStyle = color;
      canvasCtx.lineWidth = 4;
      canvasCtx.fillStyle = '#ffd000';

      const connections = [
        [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
        [11, 23], [12, 24], [23, 24],
        [23, 25], [24, 26], [25, 27], [26, 28]
      ];

      connections.forEach(([i, j]) => {
        const p1 = landmarks[i];
        const p2 = landmarks[j];
        if (p1.visibility > 0.5 && p2.visibility > 0.5) {
          canvasCtx.beginPath();
          canvasCtx.moveTo(p1.x * w, p1.y * h);
          canvasCtx.lineTo(p2.x * w, p2.y * h);
          canvasCtx.stroke();
        }
      });
    }

    /* ① 直立スキャン＆キャリブレーション */
    function handleCalibration(lm, screenHeight) {
      if (stablePoseFrames >= REQUIRED_STABLE_FRAMES) {
        const topY = lm[0].y * screenHeight;
        const bottomY = Math.max(lm[29].y, lm[30].y) * screenHeight;
        const fullHeightPx = bottomY - topY;

        pxToCmRatio = userHeightCm / fullHeightPx;

        // 基準横幅（Z軸三角測量・ヨー角算出の分母）
        const hipPx = Math.hypot((lm[23].x - lm[24].x) * canvasEl.width, (lm[23].y - lm[24].y) * canvasEl.height);
        const shoulderPx = Math.hypot((lm[11].x - lm[12].x) * canvasEl.width, (lm[11].y - lm[12].y) * canvasEl.height);

        initialHipWidthPx = hipPx;
        initialShoulderWidthPx = shoulderPx;
        initialAnkleY = Math.min(lm[27].y, lm[28].y) * canvasEl.height;

        audio.playSuccess();
        audio.speak("キャリブレーション完了！準備完了です。");
        setAppState(STATE.STANDBY);
        hudStatus.innerText = "CALIBRATED";
        hudStatus.classList.add('active');
        hudCenter.innerText = "テストを選んでスタートしてね！";
        actionBtn.innerText = "▶ テスト開始";
      } else {
        hudCenter.innerText = `直立を安定させてね (${stablePoseFrames}/${REQUIRED_STABLE_FRAMES})`;
      }
    }

    /* ② 4大テストのリアルタイム判定ロジック */
    function executeActiveTestLogic(lm, w, h) {
      switch (activeTest) {
        case 1: // 👣 目隠し足踏み（Z軸突進 ＋ ヨー角回転）
          {
            const currentHipPx = Math.hypot((lm[23].x - lm[24].x) * w, (lm[23].y - lm[24].y) * h);
            // 画面拡大率からZ軸前進距離を逆算
            const zRatio = currentHipPx / initialHipWidthPx;
            const zAdvanceCm = (zRatio - 1.0) * userHeightCm * 0.8;

            // コサイン比率から水平回転角（ヨー角）を逆算
            const widthRatio = Math.min(1.0, currentHipPx / initialHipWidthPx);
            const yawAngle = Math.round(Math.acos(widthRatio) * (180 / Math.PI));

            hudMetric.innerText = `前後: ${zAdvanceCm >= 0 ? '+' : ''}${zAdvanceCm.toFixed(1)}cm | 回旋: ${yawAngle}°`;

            // 画面外枠タッチ検知
            const isOutOfFrame = lm.some(pt => pt.visibility > 0.5 && (pt.x < 0.05 || pt.x > 0.95 || pt.y < 0.03 || pt.y > 0.97));
            if (isOutOfFrame) {
              audio.playAlert();
              finishTest("枠はみ出し！脳内GPSがズレていました！");
            }
          }
          break;

        case 2: // ⚖️ Tポーズ（肩甲骨水平度・左右独立角）
          {
            const lShoulder = { x: lm[11].x * w, y: lm[11].y * h };
            const rShoulder = { x: lm[12].x * w, y: lm[12].y * h };
            const lWrist = { x: lm[15].x * w, y: lm[15].y * h };
            const rWrist = { x: lm[16].x * w, y: lm[16].y * h };

            // 水平（0°）からの腕の垂れ下がり角
            const leftArmAngle = Math.atan2(lWrist.y - lShoulder.y, lWrist.x - lShoulder.x) * (180 / Math.PI);
            const rightArmAngle = Math.atan2(rWrist.y - rShoulder.y, rShoulder.x - rWrist.x) * (180 / Math.PI);
            const dropDiff = Math.abs(Math.round(leftArmAngle - rightArmAngle));

            hudMetric.innerText = `左右腕の傾き差: ${dropDiff}°`;
          }
          break;

        case 3: // ⚓ 片足立ち（足裏センサー・接地強制停止）
          {
            const leftY = lm[27].y * h;
            const rightY = lm[28].y * h;
            const elevationDiff = Math.abs(leftY - rightY);

            hudMetric.innerText = `足上げ高度差: ${Math.round(elevationDiff)}px`;

            // 浮かせた足が地面についた（高さ差が50px以下になった）瞬間停止
            if (elapsedSeconds > 2 && elevationDiff < 45) {
              audio.playAlert();
              finishTest("足がつきました！軸足センサー完了！");
            }
          }
          break;

        case 4: // 🪑 骨盤制動（X-Factor：胸郭純回旋と骨盤の逃げの幾何学的分離）
          {
            const currentShoulderPx = Math.hypot((lm[11].x - lm[12].x) * w, (lm[11].y - lm[12].y) * h);
            const currentHipPx = Math.hypot((lm[23].x - lm[24].x) * w, (lm[23].y - lm[24].y) * h);

            const shoulderRot = Math.acos(Math.min(1.0, currentShoulderPx / initialShoulderWidthPx)) * (180 / Math.PI);
            const hipRot = Math.acos(Math.min(1.0, currentHipPx / initialHipWidthPx)) * (180 / Math.PI);
            const xFactorSeparation = Math.max(0, Math.round(shoulderRot - hipRot));

            hudMetric.innerText = `胸-腰 分離角: ${xFactorSeparation}°`;
          }
          break;
      }
    }

    /* 🪑 イス座りドリル追跡 */
    function checkDrillAlignment(lm) {
      const currentShoulderPx = Math.hypot((lm[11].x - lm[12].x) * canvasEl.width, (lm[11].y - lm[12].y) * canvasEl.height);
      const shoulderRot = Math.acos(Math.min(1.0, currentShoulderPx / initialShoulderWidthPx)) * (180 / Math.PI);
      const isTarget = (shoulderRot >= 30);

      document.getElementById('drill-status').innerText = `角度: ${Math.round(shoulderRot)}° / 目標: 35°`;
      if (isTarget) {
        audio.playSuccess();
      }
      return isTarget;
    }
    function executeDrillTracking(lm) {
      checkDrillAlignment(lm);
    }

    /* ==========================================================================
       5. 完全ローカル録画＆リプレイ（MediaRecorder）
       ========================================================================== */
    function initMediaRecorder() {
      const canvasStream = canvasEl.captureStream(30);
      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(canvasStream);
      }
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        replayBlobUrl = URL.createObjectURL(blob);
        showReplay();
      };
    }

    function showReplay() {
      replayVideoEl.src = replayBlobUrl;
      replayVideoEl.style.display = 'block';
      replayVideoEl.play();
      hudCenter.innerText = "👀 リプレイ動画でズレを自覚しよう！";
      actionBtn.innerText = "🔄 もう一度挑戦！";
      setAppState(STATE.REPLAY);
    }

    function hideReplay() {
      replayVideoEl.pause();
      replayVideoEl.style.display = 'none';
      if (replayBlobUrl) URL.revokeObjectURL(replayBlobUrl);
    }

    /* ==========================================================================
       6. テスト実行サイクル制御
       ========================================================================== */
    function handlePrimaryAction() {
      audio.init();

      if (currentState === STATE.STANDBY) {
        if (!pxToCmRatio) {
          // 直立スキャンへ
          setAppState(STATE.CALIBRATING);
          audio.speak("カメラの前で直立してください。");
          hudCenter.innerText = "直立して静止してね！";
          actionBtn.innerText = "計測中...";
        } else {
          // テスト開始へ
          startTestSequence();
        }
      } else if (currentState === STATE.REPLAY) {
        hideReplay();
        setAppState(STATE.STANDBY);
        actionBtn.innerText = "▶ テスト開始";
        hudCenter.innerText = "準備完了！";
      }
    }

    function startTestSequence() {
      hideReplay();
      setAppState(STATE.COUNTDOWN);
      let count = 3;
      hudCenter.innerText = `目を閉じてスタンバイ！ ${count}`;
      audio.speak("目を閉じてスタンバイ！");

      const cd = setInterval(() => {
        count--;
        if (count > 0) {
          hudCenter.innerText = `目を閉じてスタンバイ！ ${count}`;
          audio.playTick();
        } else {
          clearInterval(cd);
          beginTestRunning();
        }
      }, 1000);
    }

    function beginTestRunning() {
      setAppState(STATE.TESTING);
      elapsedSeconds = 0;
      hudCenter.innerText = "テスト中！その場でキープ！";
      actionBtn.innerText = "⏹ テスト中断";

      // 録画スタート
      recordedChunks = [];
      mediaRecorder.start();

      // 足踏み時はメトロノーム作動
      if (activeTest === 1) {
        audio.speak("スタート！しっかり腿を上げて足踏み！");
        metronomeInterval = setInterval(() => audio.playTick(), 550);
      }

      // 10秒完走タイマー
      testTimer = setInterval(() => {
        elapsedSeconds++;
        if (elapsedSeconds === 7) audio.speak("ラスト3秒！");
        if (elapsedSeconds >= 10) {
          finishTest("🌟 MASTER達成！素晴らしい軸感覚です！");
        }
      }, 1000);
    }

    function finishTest(resultMsg) {
      clearInterval(testTimer);
      if (metronomeInterval) clearInterval(metronomeInterval);
      audio.playSuccess();
      audio.speak("終了！目を開けてね！");
      hudCenter.innerText = resultMsg;
      if (mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    function switchTest(testNum) {
      if (currentState === STATE.TESTING) return;
      activeTest = testNum;
      document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx + 1) === testNum);
      });
      hudMetric.innerText = "METRIC RESET";
    }

    function setAppState(nextState) {
      currentState = nextState;
      hudStatus.innerText = currentState;
    }

    /* モーダル関連 */
    function saveHeight() {
      const val = parseInt(document.getElementById('input-height').value, 10);
      if (val >= 80 && val <= 220) {
        userHeightCm = val;
        userDisplay.innerText = `👤 身長: ${userHeightCm}cm`;
        document.getElementById('height-modal').style.display = 'none';
      }
    }
    function openDrillModal() {
      setAppState(STATE.DRILL);
      document.getElementById('drill-modal').style.display = 'flex';
    }
    function closeDrillModal() {
      document.getElementById('drill-modal').style.display = 'none';
      setAppState(STATE.STANDBY);
    }

    // 起動時処理
    window.addEventListener('DOMContentLoaded', () => {
      initCamera();
    });
  </script>
</body>
</html>
